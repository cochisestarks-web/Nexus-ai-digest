services:
  - type: web
    name: nexus-ai-digest-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You set this manually in the Render dashboard
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_db
      - key: ALLOWED_ORIGINS
        value: "*"           # Update to your Netlify URL after frontend deploy
